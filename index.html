/* V3: writing canvas and workbench */
:root{--sheetwidth:1120px;--editpad:42px;--treewidth:198px;--asidewidth:240px;--editorheight:850px;--indent:0em}
body.paper-warm{--paper:#fffaf1;--panel:#fffdf9;--bg:#f5f1ea;--soft:#eee8df;--line:#e6ded2}
body.paper-grey{--paper:#f5f6f9;--panel:#fff;--bg:#e9edf4;--soft:#e4e8f0}
body.dark.paper-warm,body.dark.paper-grey{--paper:#1d2431;--panel:#1d2431;--bg:#121720;--soft:#283143;--line:#3a4354}
.editor-shell{grid-template-columns:var(--treewidth) minmax(0,1fr) var(--asidewidth)}
.sheet{max-width:var(--sheetwidth);min-height:var(--editorheight);width:100%}
.texteditor{min-height:var(--editorheight);padding:var(--editpad);padding-bottom:115px;text-indent:var(--indent);tab-size:2;resize:vertical}
.ed-scroll{padding:18px clamp(12px,2vw,32px) 35px}
.editor-head{padding:15px clamp(16px,2vw,35px) 12px}
.editor-head .ed-title{font-size:25px;margin:2px 0}
.edtoolbar{margin-top:10px}
.editor-central{min-height:0}
body.writer-wide .editor-shell{grid-template-columns:var(--treewidth) minmax(0,1fr)}
body.writer-wide .ed-aside{display:none}
body.writer-max .editor-shell{grid-template-columns:minmax(0,1fr)}
body.writer-max .editor-tree,body.writer-max .ed-aside{display:none}
.editor-layout-actions{margin-left:auto;display:flex;gap:5px;align-items:center}
body.writer-max .sheet{max-width:var(--sheetwidth)}
body.typing-mode .ed-scroll{scroll-behavior:smooth}
.prefs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;align-items:start}
.prefs-grid .card h2{margin:0 0 15px;font-size:17px}
.prefhelp{font-size:11px;color:var(--muted);line-height:1.7;margin-top:-8px;margin-bottom:16px}
.prefs-grid .field{margin-bottom:14px}
.prefcheck{display:flex;gap:9px;align-items:center;margin:12px 0;font-size:13px}
.prefcheck input{accent-color:var(--blue)}
.mind-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.mind-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:15px;align-items:stretch}
.mind-viewport{min-width:0;overflow:auto;position:relative;background:radial-gradient(circle,#cad1df 1px,transparent 1px) 0 0/22px 22px,var(--paper);border:1px solid var(--line);border-radius:7px;height:clamp(540px,70vh,820px)}
body.dark .mind-viewport{background:radial-gradient(circle,#354156 1px,transparent 1px) 0 0/22px 22px,var(--paper)}
.mind-stage{position:relative;transform-origin:top left}
.mind-lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.mindnode{position:absolute;width:206px;min-height:66px;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:6px;padding:10px 12px;box-shadow:0 6px 18px rgba(18,34,60,.09);cursor:pointer;user-select:none;touch-action:none;z-index:2}
.mindnode:hover,.mindnode.active{border-color:var(--blue);box-shadow:0 5px 21px rgba(0,47,167,.17)}
.mindnode strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.mindnode small{font-size:10px;color:var(--muted);letter-spacing:.04em}
.mindnode.world{border-left-color:#002fa7}.mindnode.chapter{border-left-color:#187f66}.mindnode.scene{border-left-color:#be7c43}.mindnode.character{border-left-color:#8b65a9}.mindnode.plot{border-left-color:#cc6686}.mindnode.root{background:#002fa7;color:white;border-color:#002fa7}.mindnode.root small{color:#d5e0ff}
.mind-detail{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:19px;max-height:820px;overflow:auto}

function v95HistoryDiff(a,b){

 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)

async function mjChooseCover(){
 const p=proj();if(!p)return;
 const inp=document.createElement('input');inp.type='file';inp.accept='image/jpeg,image/png,image/webp';
 inp.onchange=async()=>{
  const f=inp.files&&inp.files[0];if(!f)return;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast('请选择 JPG、PNG 或 WebP 图片');return}
  if(f.size>10*1024*1024){toast('封面原图不能超过 10 MB');return}
  try{
   const img=await new Promise((resolve,reject)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(u);reject(Error('无法读取图片'))};im.src=u});
   const ratio=Math.min(1,720/img.naturalWidth,1040/img.naturalHeight);
   const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.naturalWidth*ratio));cv.height=Math.max(1,Math.round(img.naturalHeight*ratio));
   const ctx=cv.getContext('2d');if(!ctx)throw Error('浏览器暂不支持图片压缩');
   ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
   let url=cv.toDataURL('image/jpeg',.72);
   if(url.length>720000){url=cv.toDataURL('image/jpeg',.48)}
   if(url.length>720000){toast('图片仍然太大，请先缩小后再上传');return}
   p.coverImage=url;update('已更换本书封面（会随作品 JSON 保存）');
   if(document.querySelector('#modal.show'))closeModal();
  }catch(err){toast('上传封面失败：'+err.message)}
 };
 inp.click();
}

async function importFile(file){if(!file)return;try{let v=JSON.parse(await file.text());if(!v||!Array.isArray(v.projects))throw Error('非墨间备份');let projects=v.projects.map(normalize);if(!projects.every(x=>x&&x.id&&Array.isArray(x.worlds)&&Array.isArray(x.chapters)))throw Error('文件不符合格式');if(!projects.length){toast('备份中没有作品');return}let merge=confirm(`读取到 ${projects.length} 本作品。\n\n【确定】合并到当前书库（推荐）\n【取消】继续选择是否替换全部作品。`);if(!merge&&!confirm('是否用备份中的作品替换当前全部作品？这会覆盖目前作品，建议先导出当前备份。'))return;let existingIds=new Set(state.projects.map(x=>x.id));if(merge){projects.forEach(p=>{if(existingIds.has(p.id))p.id=uid();state.projects.push(p)})}else{state.projects=projects;state.trash=Array.isArray(v.trash)?v.trash:[];state.settings={...defaults().settings,...(v.settings||state.settings)}};state.activeProjectId=state.projects[0]?.id||null;state.activeWorldId=state.projects[0]?.worlds[0]?.id||null;state.activeChapterId=state.projects[0]?.chapters[0]?.id||null;state.view='library';activeSearch='';libraryFilter='all';sceneFilter='all';applySettings();await save();render();toast(`已${merge?'合并':'导入'} ${projects.length} 本作品`)}catch(err){console.error(err);toast('导入失败：不是有效的墨间 JSON 文件')}finally{$('#importFile').value=''}}

let readWide=false,readerSelection=null,readerScrollTimer=null,readerSpeechItems=[],readerSpeechIndex=0,readerSpeechActive=false,readerSpeechSession=0,readerShowSettings=false,readerShowNotes=true;
const readCfg=()=>{const s=state.settings;return {fontSize:Math.max(16,+s.readerFontSize||19),lineHeight:+s.readerLineHeight||2.05,width:+s.readerWidth||850,paper:s.readerPaper||'normal',font:s.readerFont||'serif',rate:+s.readerSpeechRate||1}};
function rstate(){let p=proj();p.readerState=p.readerState||{chapterId:p.chapters[0]?.id||'',mode:'continuous',page:0,offset:0};return p.readerState}
function readerSegments(content){const t=String(content||'').replace(/\r\n?/g,'\n');const out=[];let m;const re=/[^\n]+(?:\n(?!\n)[^\n]*)*/g;while((m=re.exec(t)))out.push({text:m[0],start:m.index,end:m.index+m[0].length});return out}
function readerPages(c){const cfg=readCfg(),len=Math.round((window.innerWidth<650?490:950)*19/cfg.fontSize*2.05/cfg.lineHeight);const arr=readerSegments(c.content);let pages=[],current=[],count=0;
for(const seg of arr){if(!seg.text){continue}if(count+seg.text.length>len&&current.length){pages.push(current);current=[];count=0}if(seg.text.length>len){let start=0;while(start<seg.text.length){const available=Math.max(120,len-count);const piece={text:seg.text.slice(start,start+available),start:seg.start+start,end:seg.start+Math.min(seg.text.length,start+available)};current.push(piece);count+=piece.text.length;start+=piece.text.length;if(start<seg.text.length){pages.push(current);current=[];count=0}}}else {current.push(seg);count+=seg.text.length}}
if(current.length||!pages.length)pages.push(current);return pages}
function readerMarkerHtml(c,seg){const notes=proj().readerNotes.filter(n=>n.chapterId===c.id&&!n.orphan&&n.start<seg.end&&n.end>seg.start).sort((a,b)=>a.start-b.start);if(!notes.length)return escapeHTML(seg.text);let output='',i=0;for(const n of notes){const a=Math.max(i,n.start-seg.start,0),b=Math.min(seg.text.length,n.end-seg.start);if(b<=a)continue;output+=escapeHTML(seg.text.slice(i,a));output+=`<mark class="read-highlight" data-notejump="${n.id}" title="${escapeHTML(n.note||'阅读批注')}">${escapeHTML(seg.text.slice(a,b))}</mark>`;i=b}return output+escapeHTML(seg.text.slice(i))}
function readerParagraphs(c,segments){return segments.map(seg=>`<p class="read-paragraph" ${/^[\u3000 \t]+/.test(seg.text)?'style="text-indent:0"':''} data-reader-chapter="${c.id}" data-reader-start="${seg.start}" data-reader-end="${seg.end}">${readerMarkerHtml(c,seg)}</p>`).join('')||'<p class="read-paragraph read-empty">本章还没有正文；返回写作即可添加内容。</p>'}
function readerChapterBlock(c,segments,cover=false){const w=getWorld(proj(),c.worldId);return `<section class="read-section" id="read-c-${c.id}" data-read-section="${c.id}"><div class="read-world-name">${escapeHTML(w?.title||'正文')}</div><h2>${escapeHTML(c.title||'无标题章节')}</h2>${readerParagraphs(c,segments)}</section>`}
function reanchorReaderNotes(p){let changed=false;for(const n of p.readerNotes){const c=p.chapters.find(c=>c.id===n.chapterId);if(!c){n.orphan=true;continue}const content=String(c.content||'').replace(/\r\n?/g,'\n');if(content.slice(n.start,n.end)===n.quote){n.orphan=false;continue}let idx=content.indexOf(n.quote);if(idx>=0){let best=idx,delta=Math.abs(idx-n.start);while((idx=content.indexOf(n.quote,idx+1))!==-1){if(Math.abs(idx-n.start)<delta){best=idx;delta=Math.abs(idx-n.start)}}n.start=best;n.end=best+n.quote.length;n.orphan=false;changed=true}else if(!n.orphan){n.orphan=true;changed=true}}if(changed)mark()}

function renderMindDetail(){const p=proj(),n=mindNodeCache.find(x=>x.ref===mindSelected)||mindNodeCache[0];if(!n)return;const box=$('#mindDetail');if(!box)return;const all=graphData(p),related=p.graphLinks.filter(l=>l.from===n.ref||l.to===n.ref);

function openGraphNode(ref){let [kind,id]=ref.split(':');const p=proj();if(kind==='root'){setView('dashboard');return}if(kind==='world'){state.activeWorldId=id;setView('outline')}else if(kind==='chapter'){let c=p.chapters.find(x=>x.id===id);if(!c)return;state.activeChapterId=id;state.activeWorldId=c.worldId;setView('editor')}else if(kind==='scene'){setView('scenes');editScene(id)}else if(kind==='character'){setView('characters');editCharacter(id)}else if(kind==='event'){setView('timeline');editEvent(id)}else if(kind==='plot'){editPlot(id)}}

function editPlot(id){const p=proj(),x=p.plotNodes.find(n=>n.id===id),add=!x;const plot=x||{id:uid(),title:'',content:'',type:'剧情阶段',parentRef:mindSelected||'root',worldId:mindScope==='all'?'':mindScope};const list=graphOptions('plot:'+plot.id);let parent=list.some(a=>a.value===plot.parentRef)?plot.parentRef:'root';modal(add?'新增故事脑图节点':'编辑故事节点','用独立节点写故事的“部分”，并连接到世界、章节、人物或其他节点。',[{name:'title',label:'节点标题',value:plot.title},{name:'type',label:'节点类型',type:'select',items:['剧情阶段','伏笔','情绪转折','冲突','感情线','结局分支','其他'],value:plot.type||'剧情阶段'},{name:'parentRef',label:'归属到哪个节点',type:'select',items:list.map(a=>a.value),value:parent},{name:'content',label:'此部分的详细内容',type:'textarea',rows:9,value:plot.content}],v=>{plot.title=v.title.trim()||'未命名节点';plot.type=v.type;plot.content=v.content;plot.parentRef=v.parentRef;const par=graphData(p).find(n=>n.ref===v.parentRef);plot.worldId=par?.worldId||'';if(add)p.plotNodes.push(plot);mindSelected='plot:'+plot.id;return true});$('#f-parentRef')?.querySelectorAll('option').forEach(o=>o.textContent=list.find(x=>x.value===o.value)?.title||o.value)}
function linkGraph(prefer){const p=proj(),items=graphOptions(),start=items.some(i=>i.value===prefer)?prefer:items[0]?.value;if(items.length<2)return toast('至少需要两个节点');modal('新建故事关联','选择两段剧情、两个章节或一条伏笔的起点与回收位置。',[{name:'from',label:'起点',type:'select',items:items.map(n=>n.value),value:start},{name:'to',label:'终点',type:'select',items:items.map(n=>n.value),value:items.find(n=>n.value!==start)?.value},{name:'kind',label:'关联类型',type:'select',items:['线索延续','伏笔埋设','伏笔回收','因果推动','剧情呼应','人物影响','平行事件','其他'],value:'线索延续'},{name:'label',label:'在图上显示的连线名称',value:'线索延续'},{name:'note',label:'为何相关 / 具体情节',type:'textarea',rows:4,value:''}],v=>{if(v.from===v.to){toast('不能连接同一个节点');return false}if(p.graphLinks.some(l=>l.from===v.from&&l.to===v.to&&l.kind===v.kind)){toast('相同类型的连线已经存在');return false}p.graphLinks.push({id:uid(),from:v.from,to:v.to,kind:v.kind,label:v.label||v.kind,note:v.note,source:'manual'});return true});['from','to'].forEach(key=>$('#f-'+key)?.querySelectorAll('option').forEach(o=>o.textContent=items.find(n=>n.value===o.value)?.title||o.value))}
function enableMindDrag(){const v=$('#mindViewport');if(!v)return;let interaction=null;
 v.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;const node=e.target.closest('[data-graphnode]');const target=node||v;const ref=node?.dataset.graphnode;if(node){mindSelected=ref;renderMindDetail();$$('#mindStage .mindnode').forEach(n=>n.classList.toggle('active',n.dataset.graphnode===ref))}
 const pos=ref&&storyNodeCoordinates?.get(ref);interaction={ref,el:node,startX:e.clientX,startY:e.clientY,x:pos?.x||0,y:pos?.y||0,camera:{...canvasSnapCamera},moved:false,id:e.pointerId};target.setPointerCapture(e.pointerId);if(!node)v.classList.add('is-panning')});
 v.addEventListener('pointermove',e=>{const g=interaction;if(!g||e.pointerId!==g.id)return;const dx=e.clientX-g.startX,dy=e.clientY-g.startY;if(Math.abs(dx)+Math.abs(dy)>5)g.moved=true;if(!g.moved)return;canvasMoved=true;
 if(g.ref){const x=g.x+dx/canvasSnapCamera.z,y=g.y+dy/canvasSnapCamera.z;g.el.style.left=x+'px';g.el.style.top=y+'px'}else{canvasSnapCamera.x=g.camera.x+dx;canvasSnapCamera.y=g.camera.y+dy;storyPaintCamera()}});
 const finish=e=>{if(!interaction||e.pointerId!==interaction.id)return;const g=interaction;interaction=null;v.classList.remove('is-panning');if(!g.moved)return;if(g.ref){const x=parseFloat(g.el.style.left),y=parseFloat(g.el.style.top);proj().graphPositions[g.ref]={x,y};mark();showMindmap()}else storySaveCamera();};v.addEventListener('pointerup',finish);v.addEventListener('pointercancel',finish);
 v.addEventListener('wheel',e=>{e.preventDefault();const rect=v.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,old=canvasSnapCamera.z;const z=Math.min(2.6,Math.max(.25,old*Math.exp(-e.deltaY*.0013)));canvasSnapCamera.x=mx-(mx-canvasSnapCamera.x)*(z/old);canvasSnapCamera.y=my-(my-canvasSnapCamera.y)*(z/old);canvasSnapCamera.z=z;storyPaintCamera();clearTimeout(v._saveCameraTimer);v._saveCameraTimer=setTimeout(storySaveCamera,250)},{passive:false});

function storyZoom(step){const v=$('#mindViewport');if(!v)return;const old=canvasSnapCamera.z,z=Math.min(2.6,Math.max(.25,old*(step>0?1.22:1/1.22))),mx=v.clientWidth/2,my=v.clientHeight/2;canvasSnapCamera={x:mx-(mx-canvasSnapCamera.x)*z/old,y:my-(my-canvasSnapCamera.y)*z/old,z};storyPaintCamera();storySaveCamera()}
function storyFit(){const v=$('#mindViewport');if(!v||!storyNodeCoordinates?.size)return;const points=[...storyNodeCoordinates.values()],left=Math.min(...points.map(p=>p.x)),top=Math.min(...points.map(p=>p.y)),right=Math.max(...points.map(p=>p.x+216)),bottom=Math.max(...points.map(p=>p.y+85)),pad=55;const z=Math.min(1.15,Math.max(.25,Math.min((v.clientWidth-2*pad)/(right-left||1),(v.clientHeight-2*pad)/(bottom-top||1))));canvasSnapCamera={x:(v.clientWidth-(left+right)*z)/2,y:(v.clientHeight-(top+bottom)*z)/2,z};storyPaintCamera();storySaveCamera()}

function v92BuildContext(p,c,q='',budget=4800){if(!p||!c)return '';v92norm(p);const terms=(String(q||'').toLowerCase().match(/[\p{Script=Han}]{2,6}|[a-z0-9]{3,}/gu)||[]).slice(0,35);const i=p.chapters.findIndex(x=>x.id===c.id);const pool=p.chapters.filter(x=>x.id!==c.id).map(x=>{const title=x.title||'',syn=x.synopsis||'',m=p.chapterMemories.find(m=>m.chapterId===x.id&&m.verified),txt=([title,syn,m?.summary,m?.facts,m?.clues].filter(Boolean).join(' ')).toLowerCase();let score=terms.reduce((a,k)=>a+(txt.includes(k)?2:0),0);const j=p.chapters.indexOf(x);if(j<i)score+=Math.max(0,5-Math.floor((i-j)/4));if(j>i)score-=4;const links=p.linkRecords.filter(l=>l.chapterId===x.id&&terms.some(k=>(l.quote+' '+l.memo).toLowerCase().includes(k)));score+=links.length*5;return {x,m,score}}).filter(y=>y.score>0).sort((a,b)=>b.score-a.score).slice(0,5);const related=p.linkRecords.filter(l=>l.chapterId===c.id||terms.some(k=>(l.quote+' '+l.memo).toLowerCase().includes(k))).slice(0,8);let parts=['【相关章节检索（仅已确认事实可视为可靠记忆，均标注来源）】',...pool.map(y=>`来源《${y.x.title}》${y.m?'（已确认记忆）':'（章节梗概，未经核验）'}：${shorten(y.m?[y.m.summary,y.m.facts].filter(Boolean).join('；'):y.x.synopsis,480)}`),'【关联的剧情、人物、伏笔】',...related.map(l=>{const t=v92getTarget(p,l);return `来源《${v9ch(l.chapterId)?.title||'未知章节'}》摘录「${shorten(l.quote,95)}」 → ${t?.title||'目标已删除'}（${l.kind}）${shorten(l.memo,100)}`})];return parts.join('\n').slice(0,budget)}

 const raw=JSON.stringify(w);let h=2166136261;
 for(let i=0;i<raw.length;i++)h=Math.imul(h^raw.charCodeAt(i),16777619);

/* V9.3 永久删除/回收站同步修复：写入持久删除记录，避免另一设备用旧副本复活作品。 */
function v93BookOp(local,remote){
 if(!local)return remote||null;if(!remote)return local;
 const a=Number(local.at)||0,b=Number(remote.at)||0;
 if(a!==b)return a>b?local:remote;
 const order={restore:0,trash:1,purge:2};
 return (order[local.kind]||0)>=(order[remote.kind]||0)?local:remote;
}
function v93RecordBookOp(id,kind){
 if(!id||!['trash','purge','restore'].includes(kind))return;
 if(!state.bookOperations||typeof state.bookOperations!=='object')state.bookOperations={};
 const previous=state.bookOperations[id];
 state.bookOperations[id]={kind,at:Math.max(Date.now(),(Number(previous?.at)||0)+1)};
}
function v93ForgetPurgedDrafts(ids){
 const set=new Set(ids);if(!set.size)return;
 // 删除作品的章节快照和光标记录，避免留下隐私碎片；异步清理失败不影响云端删除记录。
 try{const prefix=v95AccountKey('chapter_history__'),caretPrefix=v95AccountKey('caret__');
  const purgeKeys=[];for(const key of Object.keys(localStorage))if(ids.some(id=>key.startsWith(prefix+id+'__')||key.startsWith(caretPrefix+id+'__')))purgeKeys.push(key);
  purgeKeys.forEach(k=>localStorage.removeItem(k));
  if(db){const tr=db.transaction('storage','readwrite'),store=tr.objectStore('storage');
   const req=store.openCursor();req.onsuccess=e=>{const cursor=e.target.result;if(!cursor)return;
    const key=String(cursor.key);if(ids.some(id=>key.startsWith(prefix+id+'__')))cursor.delete();cursor.continue();};
  }
 }catch(err){console.warn('历史快照隐私清理失败',err)}
 try{localStorage.setItem(MOJIAN_DRAFT_GUARD_KEY,JSON.stringify(mojianReadGuards().filter(x=>!set.has(x.bookId))))}
 catch(e){console.warn('旧正文草稿保护缓存清理未完成',e)}
 // 历史恢复点是独立的整库副本：清除其中的永久删除作品，但不影响其他书。
 try{
  const shots=v9GetSnapshots();let changed=false;
  for(const shot of shots){
   if(!shot?.data)continue;
   const old=JSON.parse(shot.data),n=(old.projects||[]).length+(old.trash||[]).length;
   old.projects=(old.projects||[]).filter(p=>!set.has(p.id));
   old.trash=(old.trash||[]).filter(p=>!set.has(p.id));
   if((old.projects.length+old.trash.length)!==n){shot.data=JSON.stringify(old);shot.books=old.projects.length;shot.bytes=shot.data.length;changed=true}
  }
  if(changed)localStorage.setItem(v9SnapshotKey,JSON.stringify(shots));
 }catch(e){console.warn('本机历史快照清理未完成，请检查浏览器存储',e)}
}
function v93PurgeBooks(ids){

 state.trash=(state.trash||[]).filter(p=>!set.has(p.id));
 unique.forEach(id=>v93RecordBookOp(id,'purge'));
 if(set.has(state.activeProjectId)){state.activeProjectId=state.projects[0]?.id||null;state.activeChapterId=null;state.activeWorldId=null;state.view='library'}

function v93MergeBooks(local,remote,base){
 // Tombstones win over stale book copies. Restored books are explicitly marked and can survive future merges.
 const ops={...(remote.bookOperations||{})};
 for(const [id,op] of Object.entries(local.bookOperations||{}))ops[id]=v93BookOp(op,ops[id]);
 // Migrate pre-fix books already placed in a recycle bin into a soft-deletion record.
 for(const t of [...(remote.trash||[]),...(local.trash||[])]){
  if(!t?.id||ops[t.id])continue;
  ops[t.id]={kind:'trash',at:Number(t.deletedAt)||Date.now()};
 }
 const removed=id=>['trash','purge'].includes(ops[id]?.kind);
 const lm=new Map((local.projects||[]).map(p=>[p.id,p]));
 const rm=new Map((remote.projects||[]).map(p=>[p.id,p]));
 const known=base?.books||{};const out=[],conflicts=[];let newActive=local.activeProjectId;
 for(const [id,r] of rm){
  if(removed(id))continue;
  const l=lm.get(id),old=known[id],rh=v93BookFingerprint(r);
  if(!l){
   if(ops[id]?.kind==='restore'||!old||old!==rh)out.push(r);
   // A remote change conflicting with a local deletion should be preserved only if it was not explicitly deleted.
   continue;
  }
  lm.delete(id);
  const lh=v93BookFingerprint(l);
  if(lh===rh){out.push(l);continue}
  if(old&&lh===old){out.push(r);continue}
  if(old&&rh===old){out.push(l);continue}
  // If differing only in local view metadata, don't spawn multiple novels.
  const neutral=x=>{const v=JSON.parse(JSON.stringify(x));delete v.workspace;delete v.updatedAt;delete v.lastSaved;return JSON.stringify(v)};
  if(neutral(l)===neutral(r)){out.push(Number(l.updatedAt||0)>=Number(r.updatedAt||0)?l:r);continue}
  out.push(r);
  const preserved=v93ConflictBook(l,'本机稿件保留');out.push(preserved);conflicts.push(id);
  if(local.activeProjectId===id)newActive=preserved.id;
 }
 for(const [id,l] of lm){
  if(removed(id))continue;
  const old=known[id];
  if(ops[id]?.kind==='restore'||!old||v93BookFingerprint(l)!==old)out.push(l);
 }
 const archive=new Map();
 for(const t of [...(remote.trash||[]),...(local.trash||[])]){
  if(!t?.id||ops[t.id]?.kind==='purge'||ops[t.id]?.kind==='restore')continue;
  const previous=archive.get(t.id);
  if(!previous||Number(t.updatedAt||0)>=Number(previous.updatedAt||0))archive.set(t.id,t);
 }
 // If one device placed a book in the bin and another is still online with an old active copy,
 // keep it in the bin instead of restoring it onto the bookshelf.
 for(const [id,op] of Object.entries(ops)){
  if(op.kind!=='trash'||archive.has(id))continue;
  const existing=(local.projects||[]).find(p=>p.id===id)||(remote.projects||[]).find(p=>p.id===id);
  if(existing)archive.set(id,{...existing,deletedAt:Number(op.at)||Date.now()});
 }
 const merged={...local,projects:out,trash:[...archive.values()],bookOperations:ops,activeProjectId:newActive};
 if(!out.some(p=>p.id===merged.activeProjectId))merged.activeProjectId=out[0]?.id||null;
 return {data:merged,conflicts};
}
function v93ScheduleCloudSync(ms=1500){
 if(!v93Prefs.autoSync||!v9CloudToken()||!mojianAuthState.connected)return;
 if(v93AutoQueue)clearTimeout(v93AutoQueue);
 v93AutoQueue=setTimeout(()=>{v93AutoQueue=null;v93SyncRun(false)},ms);

async function v93SyncRun(manual=false){
 if(!v9CloudToken()||!mojianAuthState.connected){if(manual)toast('请先登录私人书库');return false}
 if(v93SyncBusy){v93AutoSyncRepeat=true;return false}
 v93SyncBusy=true;v95OnCloudStart();v93SyncMessage='正在自动同步…';let ok=false;
 try{
  // A snapshot protects unsynced drafts before any cloud download/merge.
  await save();
  for(let attempt=0;attempt<4;attempt++){
   const source=JSON.parse(JSON.stringify(state));
   const sourceSig=v93SyncSignature(source),prior=v93CloudBaseRead();
   const cloud=await v9CloudRequest('GET');const rev=Number(cloud.revision)||0;
   if(!cloud.data && rev>0)throw Error('云端返回了修订号但没有正文，已阻止覆盖');
   const remote=cloud.data||{projects:[],trash:[]};
   if(!Array.isArray(remote.projects)||!Array.isArray(remote.trash))throw Error('云端小说数据格式异常，已保留本机稿件');
   if(v93SyncSignature(state)!==sourceSig){continue} // User typed during request; recapture.
   let result,legacyClean=!prior && v93GetLastHash()===sourceSig && !!v9Cloud.revision;
   if((source.projects||[]).length===0 && (source.trash||[]).length===0 && !prior){
      result={data:{...source,projects:remote.projects,trash:remote.trash},conflicts:[]};
   }else if(legacyClean && rev>0){
      result={data:{...source,projects:remote.projects,trash:remote.trash},conflicts:[]};
   }else{
      result=v93MergeBooks(source,remote,prior);
   }
   let next=result.data;
   const cloudSig=v93SyncSignature(remote),nextSig=v93SyncSignature(next);
   let updatedRev=rev;
   if(nextSig!==cloudSig){
     if(v93SyncSignature(state)!==sourceSig)continue;
     try{
      const up=await v9CloudRequest('PUT',{revision:rev,data:next});
      updatedRev=Number(up.revision)||rev+1;
     }catch(e){
       if(attempt<3 && /409|conflict|修订|版本|冲突/i.test(e.message)){continue}
       throw e;
     }
   }
   // The write may have taken time; preserve edits made while the request was in flight.
   const liveSig=v93SyncSignature(state);
   if(liveSig!==sourceSig){
      const rebased=v93MergeBooks(state,next,v93CloudBaseMake(source,rev));
      next=rebased.data;
   }
   // 正文输入框的事件监听器引用当前章对象。内容相同时绝不重建 state，
   // 否则输入框仍更新旧对象，表面字数在涨，但实际书库没有保存新文字。
   mojianFlushVisibleEditorDraft();
   const changed=v93SyncSignature(state)!==v93SyncSignature(next);
   if(changed && (state.projects||[]).length && (remote.projects||[]).length){
     try{v9SaveSnapshot(false)}catch(e){console.warn('本机恢复点暂不可用',e)}
   }
   const savedCloud=nextSig===cloudSig?remote:result.data;
   if(changed){
     const ed=document.getElementById('edBody');
     const focused=!!ed && state.view==='editor' && document.activeElement===ed;
     const selection=focused?{start:ed.selectionStart,end:ed.selectionEnd,direction:ed.selectionDirection}:null;
     // 同步中有新的键入时，绝不让网络响应覆盖编辑框里的新字。
     if(v93SyncSignature(state)!==liveSig){
       const newer=v93MergeBooks(state,next,v93CloudBaseMake(source,rev));
       next=newer.data;v93AutoSyncRepeat=true;
     }
     state=next;consistent();
     // 重画可重新绑定最新章节对象，而不是继续向旧对象写稿。
     render();
     if(selection){const live=document.getElementById('edBody');if(live){live.focus({preventScroll:true});try{live.setSelectionRange(selection.start,selection.end,selection.direction)}catch(e){}}}
   }
   // 从另一台设备同步过来的永久删除，也同步清理本机独立草稿与恢复点。
   const cloudPurged=Object.entries(next.bookOperations||{}).filter(([id,op])=>op?.kind==='purge'&&(source.bookOperations||{})[id]?.kind!=='purge').map(([id])=>id);
   if(cloudPurged.length)v93ForgetPurgedDrafts(cloudPurged);
   // 仅更新云端元信息，不动未变化的本机 state 与活动编辑器。
   v93CloudBaseWrite(savedCloud,updatedRev);
   await save();
   if(result.conflicts.length){v93SyncMessage='已自动保留不同版本：'+result.conflicts.length+' 处';toast('检测到不同设备都修改了同一本小说，两个版本已分别保留')}
   else v93SyncMessage=v93SyncSignature(state)===v93SyncSignature(savedCloud)?'正文与云端一致 · 版本 '+updatedRev:'本机草稿已保存 · 云端正在继续同步';
   const fullySynced=v93SyncSignature(state)===v93SyncSignature(savedCloud);
   if(!fullySynced)v93AutoSyncRepeat=true;
   v95OnCloudResult(fullySynced);
   ok=true;break;
  }
  if(!ok){v93SyncMessage='写作期间发生更新，正在重新尝试同步';v95OnCloudResult(false);}
 }catch(e){
  v93SyncMessage='自动同步未完成，本机稿件仍保留：'+e.message;v95OnCloudResult(false,e.message);
  console.warn(v93SyncMessage);
  if(manual)toast(v93SyncMessage);
 }finally{
  v93SyncBusy=false;
  if(state?.view==='syncStudio')v93ShowSync();
  if(v93AutoSyncRepeat){v93AutoSyncRepeat=false;v93ScheduleCloudSync(300)}
 }
 return ok;
}

async function v93ConflictResolve(direction){if(!v93SyncConflict)return;if(direction==='cloud'){if(!confirm('将用云端版本替换本地作品。操作前会建立本机恢复点，请确认。'))return;v9SaveSnapshot(true);const remote=await v9CloudRequest('GET');const old=state;try{state=remote.data;consistent();state.settings={...defaults().settings,...state.settings};v9Cloud.revision=remote.revision;v9CloudStore();v93SetHash();v93SyncConflict=null;state.view='library';await save();render();toast('已采用云端版本')}catch(e){state=old;toast(e.message)}}else if(direction==='local'){if(!confirm('即将把本机版本作为最终版本覆盖云端。确认你已备份两台设备的数据！'))return;v9SaveSnapshot(true);const remote=await v9CloudRequest('GET');const up=await v9CloudRequest('PUT',{revision:remote.revision,data:state});v9Cloud.revision=up.revision;v9CloudStore();v93SetHash();v93SyncConflict=null;toast('已采用本机版本上传');v93ShowSync()}}
function v93ShowSync(){const p=proj();if(!p)return setView('library');v93Page('跨设备云同步','正文每次输入都先存独立草稿保护区和本机数据库，再自动上传云端；同步失败会显示原因，联网后重试。',`<button class="btn" data-mojian-auth="status">账号与连接状态</button>`,`<div class="cards three"><div class="card"><div class="smalllabel">同步地址</div><strong>${v93esc(v9Cloud.url||'未配置')}</strong></div><div class="card"><div class="smalllabel">云端修订号</div><div class="number">${v9Cloud.revision||0}</div></div><div class="card"><div class="smalllabel">当前状态</div><p>${v93esc(v93SyncMessage)}</p></div></div>${v93Card('自动同步策略','自动同步默认开启。写作修改后自动上传，打开页面及切回页面时自动检查。离线时先保存在本机，联网后再同步。',`<label class="prefcheck"><input type="checkbox" id="v93AutoSync" ${v93Prefs.autoSync?'checked':''}>启用自动同步（需要已连接的服务端）</label><div class="field"><label>检查间隔</label><select class="select" id="v93SyncMins">${v93Label(String(v93Prefs.syncMins),[['1','1 分钟'],['3','3 分钟'],['5','5 分钟'],['10','10 分钟']])}</select></div><div class="v93-row"><button class="btn primary" data-v93="sync-save">保存同步设置</button><button class="btn" data-v93="sync-now">立即检查并同步</button></div>`)}${v93SyncConflict?v93Card('需要处理的版本冲突',`云端修订号 ${v93SyncConflict.revision}；本机与云端都有修改。为避免丢稿，已暂停自动覆盖。先导出本机备份，再选择版本。`,`<div class="v93-row"><button class="btn" data-action="export-all">下载本机完整 JSON</button><button class="btn" data-v93="sync-use-cloud">采用云端（替换本机）</button><button class="btn danger" data-v93="sync-use-local">采用本机（覆盖云端）</button></div>`):''}<p class="v93-tip">同一时间在两台设备编辑相同作品仍可能发生冲突。首次登录会自动安全下载云端版本；同时改动时自动保留两个稿件版本。字体文件仍需在每台设备各自导入。</p>`)}
setInterval(()=>{if(v93Prefs.autoSync&&document.visibilityState==='visible'&&mojianAuthState.connected&&Date.now()-v93AutoLastPoll>15000){v93AutoLastPoll=Date.now();v93SyncRun(false)}},5000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')v93ScheduleCloudSync(150);else v93ScheduleCloudSync(0)});

let v93SyncLast=Date.now();

document.addEventListener('click',async e=>{const el=e.target.closest('[data-v93]');if(!el)return;const a=el.dataset.v93,id=el.dataset.id;try{switch(a){case 'font-add':v93FontAdd();break;case 'font-remove':v93FontRemove();break;case 'layout-save':v93Prefs.treeWidth=+$('#v93TreePref')?.value||232;v93Prefs.asideWidth=+$('#v93AsidePref')?.value||250;v93Prefs.hideTree=!!$('#v93HideTree')?.checked;v93Prefs.hideAside=!!$('#v93HideAside')?.checked;v93SavePrefs();toast('布局偏好已保存');break;case 'toggle-tree':v93Prefs.hideTree=!v93Prefs.hideTree;v93SavePrefs();break;case 'toggle-aside':if(window.matchMedia('(max-width:870px)').matches){v951ToggleAssistant();}else{v93Prefs.hideAside=!v93Prefs.hideAside;v93SavePrefs();}break;case 'state-new':v93OpenState(el.dataset.char);break;case 'state-edit':v9EditState(id);break;case 'prices-save':$$('[data-v93-price]').forEach(x=>{let k=x.dataset.key;v93Prefs.priceRules[k]??=[0,0];v93Prefs.priceRules[k][x.dataset.v93Price==='in'?0:1]=Math.max(0,+x.value||0)});v93SavePrefs();v93ShowUsage();toast('费用规则已保存');break;case 'timer-start':v93TimerStart();break;case 'timer-stop':v93TimerStop(false);break;case 'asset-add':v93ImageAdd();break;case 'asset-edit':v93EditAsset(id);break;case 'asset-delete':if(confirm('确定删除这张素材吗？')){proj().mediaAssets=proj().mediaAssets.filter(x=>x.id!==id);mark();v93Assets()}break;case 'asset-save':{const x=proj()?.mediaAssets.find(x=>x.id===id);if(x){x.title=$('#v93AssetName').value;x.notes=$('#v93AssetNotes').value;const z=($('#v93AssetBind').value||'').split(':');x.bindType=z[0]||'';x.bindId=z[1]||'';closeModal();mark();v93Assets()}break}case 'asset-download':{const x=proj()?.mediaAssets.find(x=>x.id===id);if(!x)break;const a=document.createElement('a');a.href=x.src;a.download=(x.title||'图片')+'.jpg';a.click();break}case 'badwords-save':v93Prefs.badWords=$('#v93BadWords').value;v93SavePrefs();v93Publishing();break;case 'flag-open':v9GoChapter(id);break;case 'check-export':v93Download((proj()?.title||'小说')+'_稿件检查.txt',v93Check().map(x=>`${x.title}\t${x.kind}\t${x.details}`).join('\n')||'当前规则未发现问题');break;case 'print-book':v93PrintBook();break;case 'sync-save':v93Prefs.autoSync=!!$('#v93AutoSync').checked;v93Prefs.syncMins=+$('#v93SyncMins').value||3;v93SavePrefs();toast('同步设置已保存');break;case 'sync-now':v93SyncLast=Date.now();await v93SyncRun(true);break;case 'sync-use-local':await v93ConflictResolve('local');break;case 'sync-use-cloud':await v93ConflictResolve('cloud');break;case 'modal-close':closeModal();break;}}catch(err){console.error(err);toast('操作未完成：'+err.message)}});
setTimeout(()=>{v93RestoreFonts().catch(console.warn);v93ApplyPrefs()},1400);


/* 墨间 V9.4 多账号管理：云端区分角色，只有总号可以开户。 */
const mojianAuthState={busy:false,setupComplete:null,connected:false,user:null};
function mojianAuthEsc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function mojianAuthNote(msg,isError=false){const e=document.getElementById('mojanAuthMsg');if(e){e.textContent=msg;e.style.color=isError?'#c33b4c':'#59667c'}}
async function mojianApi(path,method='GET',data=null){
 const writing=method==='POST';
 const payload=writing?{...(data||{})}:null;
 let r;try{r=await fetch(MOJIAN_CLOUD_ENDPOINT+path,{method,headers:writing?{'Content-Type':'text/plain;charset=UTF-8'}:{},body:writing?JSON.stringify(payload):undefined,cache:'no-store',credentials:'omit'});}
 catch(e){throw Error('无法连接云端：'+e.message)}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'云端 HTTP '+r.status);return j;
}
function mojianAuthShow(mode='login'){
 const root=document.getElementById('mojianAuthWall');if(!root)return;
 root.hidden=false;document.body.classList.add('mojan-locked');
 const current=mojianAuthState.setupComplete===false?'setup':mode;
 const login=current==='login',setup=current==='setup',reset=current==='reset';
 root.innerHTML=`<div class="mojan-card"><div class="mojan-symbol">墨</div><div class="mojan-eyebrow">MOJIAN / MEMBER CLOUD</div><h1>${setup?'设置总账号':reset?'找回总账号密码':'欢迎回到墨间'}</h1><p class="mojan-blurb">${setup?'只有持有原始云端所有者密钥的人可以首次设置管理员。':reset?'使用原始所有者密钥找回总账号密码。':'输入账号和密码进入自己的独立书库。只有总账号可以为别人创建账号。'}</p><form id="mojanForm" autocomplete="on">${!login?`<label for="mojanOwner">原始所有者密钥</label><input type="password" id="mojanOwner" autocomplete="off" required placeholder="首次设置或找回密码时填写">`:''}<label for="mojanUsername">账号</label><input id="mojanUsername" value="${setup||reset?'changchunlu9':''}" ${login?'':'readonly'} autocomplete="username" spellcheck="false" required placeholder="输入账号"><label for="mojanPass">${login?'登录密码':'新密码（至少10位）'}</label><input type="password" id="mojanPass" autocomplete="${login?'current-password':'new-password'}" minlength="${login?1:10}" required placeholder="${login?'输入密码':'设置新密码'}">${login?'':`<label for="mojanPassAgain">确认新密码</label><input type="password" id="mojanPassAgain" autocomplete="new-password" minlength="10" required>`}${login?'<label class="mojan-remember"><input type="checkbox" id="mojanRemember" checked>在此设备保持登录（最多7天；公共设备请取消）</label>':''}<button class="mojan-primary" type="submit">${setup?'设置总账号':reset?'更新管理员密码':'登录我的书库'}</button></form><div class="mojan-msg" id="mojanAuthMsg" role="status"></div><div class="mojan-foot">${login?'<button type="button" data-mojan-switch="reset">总账号忘记密码？</button>':`<button type="button" data-mojan-switch="login">返回登录</button>`}</div><div class="mojan-safe">每个账号单独储存小说、草稿和同步版本。普通用户不能注册或管理其他账号。</div></div>`;
 root.querySelector('#mojanForm').addEventListener('submit',mojianAuthSubmit);
 root.querySelector('[data-mojan-switch]')?.addEventListener('click',()=>mojianAuthShow(root.querySelector('[data-mojan-switch]').dataset.mojanSwitch));
}
async function mojianApplyAccount(info){
 if(!info||!info.uid||!['admin','member'].includes(info.role))throw Error('云端未返回有效账户身份');
 mojianAccount={uid:info.uid,username:info.username,role:info.role};
 MOJIAN_DRAFT_GUARD_KEY=mojianLocalKey('mojian_body_guard_20261020_v1');
 v9SnapshotKey=mojianLocalKey('mojian_v9_snapshots');
 v93Storage=mojianLocalKey('mojian_v93_prefs');
 v93SyncKey=mojianLocalKey('mojian_v93_sync_hash');
 v93AutoBaseKey=mojianLocalKey('mojian_v93_auto_cloud_base_v1');
 v93Prefs={customFont:'',autoSync:true,syncMins:1,treeWidth:232,asideWidth:250,hideTree:false,hideAside:false,priceRules:{},badWords:'',timerMinutes:25,...(()=>{try{return JSON.parse(localStorage.getItem(v93Storage)||'{}')}catch(e){return {}}})()};
 v93Prefs.autoSync=true;v95ResetAccountStatus();
 v9CloudConfig();
 sessionApiKeys.clear();apiProfiles=[];activeApiId='';customPrompts=[];loadApiProfiles();
 v93SyncBusy=false;v93SyncConflict=null;v93SyncMessage='正在加载 '+info.username+' 的书库';
 clearTimeout(saveTimer);
 if(typeof v93AutoQueue!=='undefined'&&v93AutoQueue)clearTimeout(v93AutoQueue);
 await init(); // 强制从该账户专属 IndexedDB 键加载；普通账号绝不导入总账号旧稿。
 v93SavePrefs();
}
async function mojianAuthSubmit(event){
 event.preventDefault();if(mojianAuthState.busy)return;
 const root=document.getElementById('mojianAuthWall'),title=root.querySelector('h1').textContent;
 const login=title==='欢迎回到墨间',reset=title==='找回总账号密码';
 const password=document.getElementById('mojanPass').value;
 if(!login&&password!==document.getElementById('mojanPassAgain').value)return mojianAuthNote('两次密码不一致',true);
 mojianAuthState.busy=true;root.querySelector('.mojan-primary').disabled=true;mojianAuthNote('正在验证账号…');
 try{
  if(!login){
    await mojianApi(reset?'/api/auth/reset':'/api/auth/setup','POST',{ownerKey:document.getElementById('mojanOwner').value.trim(),password});
    mojianAuthState.setupComplete=true;mojianAuthShow('login');mojianAuthNote('已设置密码，请使用总账号登录');return;
  }
  const username=document.getElementById('mojanUsername').value.trim();
  const remember=!!document.getElementById('mojanRemember').checked;
  const res=await mojianApi('/api/auth/login','POST',{username,password,remember});
  localStorage.removeItem('mojian_auth_v1');sessionStorage.removeItem('mojian_auth_v1');
  localStorage.removeItem('mojian_auth_v2');sessionStorage.removeItem('mojian_auth_v2');
  (remember?localStorage:sessionStorage).setItem('mojian_auth_v2',res.token);
  mojianAuthState.user={uid:res.uid,username:res.username,role:res.role};
  mojianAuthState.connected=false;
  await mojianAfterLogin();
  root.hidden=true;document.body.classList.remove('mojan-locked');
 }catch(e){mojianAuthNote(e.message,true)}finally{mojianAuthState.busy=false;const btn=root.querySelector('.mojan-primary');if(btn)btn.disabled=false}
}
function mojianAuthLogout(show=true){
 sessionStorage.removeItem('mojian_auth_v2');localStorage.removeItem('mojian_auth_v2');
 sessionStorage.removeItem('mojian_auth_v1');localStorage.removeItem('mojian_auth_v1');
 mojianAuthState.connected=false;mojianAuthState.user=null;mojianAccount=null;
 sessionApiKeys.clear();state=defaults();v93SyncMessage='未登录';v95ResetAccountStatus();
 document.getElementById('mojanManage')?.remove();
 if(show)mojianAuthShow('login');
}
async function mojianAfterLogin(){
 await mojianInitReady;
 await mojianApplyAccount(mojianAuthState.user);
 mojianAuthState.connected=true;
 try{const ok=await v93SyncRun(true);if(!ok)toast('本机稿已保存，云同步稍后重试');}
 catch(e){v93SyncMessage='暂无法同步：'+e.message;toast('登录成功，云端同步暂不可用')} 
 render();
}
async function mojianAuthBoot(){
 const root=document.getElementById('mojianAuthWall');if(!root)return;
 root.hidden=false;document.body.classList.add('mojan-locked');
 root.innerHTML='<div class="mojan-card"><div class="mojan-symbol">墨</div><h1>正在连接墨间账户…</h1></div>';
 try{
  const info=await mojianApi('/api/auth/status');mojianAuthState.setupComplete=!!info.setupComplete;
  if(!info.setupComplete){mojianAuthShow('setup');return}
  const token=v9CloudToken();
  if(token){
    try{
      const me=await mojianApi('/api/account/me','POST',{session:token});
      mojianAuthState.user={uid:me.uid,username:me.username,role:me.role};
      await mojianAfterLogin();root.hidden=true;document.body.classList.remove('mojan-locked');return;
    }catch(e){localStorage.removeItem('mojian_auth_v2');sessionStorage.removeItem('mojian_auth_v2');}
  }
  mojianAuthShow('login');
 }catch(e){mojianAuthState.setupComplete=null;mojianAuthShow('login');mojianAuthNote('连接失败：请先更新云函数，再刷新。'+e.message,true)}
}
function mojianAccountWindow(html){
 document.getElementById('mojanManage')?.remove();
 const el=document.createElement('div');el.id='mojanManage';el.className='mojan-manage-mask';
 el.innerHTML=`<div class="mojan-manage-card"><div class="mojan-manage-head"><h2>墨间 · 账户设置</h2><button type="button" class="btn" data-mojian-admin="close">关闭</button></div>${html}</div>`;
 document.body.appendChild(el);
}
async function mojianOpenAccountManager(){
 if(mojianAccount?.role!=='admin')return toast('只有总账号能管理用户');
 mojianAccountWindow('<p>正在读取子账号…</p>');
 try{
  const result=await mojianApi('/api/account/list','POST',{session:v9CloudToken()});
  mojianAccountWindow(`<p class="sub">总账号：${mojianAuthEsc(mojianAccount.username)}。只有你可以创建、停用及重设子账号密码，所有书库互不串稿。</p><form id="mojanAddUser"><h3>新增子账号</h3><div class="mojan-fieldrow"><input id="mojanNewUser" class="input" required pattern="[A-Za-z][A-Za-z0-9_-]{2,31}" autocomplete="off" placeholder="账号（英文/数字）"><input id="mojanNewPassword" class="input" type="password" minlength="10" required autocomplete="new-password" placeholder="初始密码（至少10位）"><button class="btn primary" type="submit">创建账号</button></div></form><h3>已有子账号（${result.users.length}）</h3><div class="mojan-users">${result.users.length?result.users.map(u=>`<div class="mojan-user" data-mojian-name="${mojianAuthEsc(u.username)}"><div><b>${mojianAuthEsc(u.username)}</b><small>${u.disabled?'已停用':'正常使用'}</small></div><input class="input mojan-reset-password" type="password" minlength="10" placeholder="新密码，至少10位" autocomplete="new-password"><button class="btn" data-mojian-admin="reset" data-name="${mojianAuthEsc(u.username)}">重置密码</button><button class="btn ${u.disabled?'':'danger'}" data-mojian-admin="toggle" data-name="${mojianAuthEsc(u.username)}" data-disabled="${u.disabled?'0':'1'}">${u.disabled?'重新启用':'停用账号'}</button></div>`).join(''):'<p>还没有子账号。</p>'}</div><p class="sub">停用及重置密码会让该子账号原有的登录状态失效；不会删除对方已经保存的小说。</p><p id="mojanManageMsg" role="status"></p>`);
  document.getElementById('mojanAddUser').addEventListener('submit',async e=>{
    e.preventDefault();const name=document.getElementById('mojanNewUser').value.trim(),password=document.getElementById('mojanNewPassword').value;
    try{await mojianApi('/api/account/create','POST',{session:v9CloudToken(),username:name,password});toast('已创建子账号：'+name);await mojianOpenAccountManager()}
    catch(err){document.getElementById('mojanManageMsg').textContent=err.message}
  });
 }catch(e){mojianAccountWindow('<p>无法获取子账号：'+mojianAuthEsc(e.message)+'</p>')}
}
function mojianOpenChangePassword(){
 if(!mojianAccount)return toast('请先登录');
 mojianAccountWindow(`<p class="sub">当前登录：${mojianAuthEsc(mojianAccount.username)}。修改成功后需要重新登录，其它设备的旧登录也会失效。</p><form id="mojanChangePassword"><label>当前密码</label><input class="input" name="current" type="password" autocomplete="current-password" required><label>新密码（至少10位）</label><input class="input" name="next" type="password" minlength="10" autocomplete="new-password" required><label>再输入一次新密码</label><input class="input" name="again" type="password" minlength="10" autocomplete="new-password" required><p><button class="btn primary" type="submit">确认修改</button></p></form><p id="mojanManageMsg" role="status"></p>`);
 document.getElementById('mojanChangePassword').addEventListener('submit',async e=>{
  e.preventDefault();const form=e.currentTarget,old=form.elements.current.value,now=form.elements.next.value;
  if(now!==form.elements.again.value){document.getElementById('mojanManageMsg').textContent='两次新密码不一致';return}
  try{await save();await mojianApi('/api/account/password','POST',{session:v9CloudToken(),currentPassword:old,newPassword:now});mojianAuthLogout(true);mojianAuthNote('密码已修改，请重新登录');}
  catch(err){document.getElementById('mojanManageMsg').textContent=err.message}
 });
}
document.addEventListener('click',async e=>{
 const auth=e.target.closest('[data-mojian-auth]');
 if(auth?.dataset.mojianAuth==='status'){
  if(!mojianAuthState.connected)return mojianAuthShow('login');
  if(confirm('当前账号：'+mojianAccount.username+'。\n确定要退出登录吗？')){
   try{await save()}catch(err){if(!confirm('当前本机保存可能失败。仍要退出吗？'))return}
   mojianAuthLogout(true);
  }
  return;
 }
 if(e.target.closest('[data-mojian-account="password"]'))return mojianOpenChangePassword();
 const btn=e.target.closest('[data-mojian-admin]');if(!btn)return;
 const act=btn.dataset.mojianAdmin;
 if(act==='open'){document.getElementById('sidebar')?.classList.remove('mobileopen');return mojianOpenAccountManager();}
 if(act==='close')return document.getElementById('mojanManage')?.remove();
 if(mojianAccount?.role!=='admin')return toast('没有权限');
 const name=btn.dataset.name,row=btn.closest('.mojan-user');
 try{
  if(act==='reset'){
   const password=row?.querySelector('.mojan-reset-password')?.value||'';
   if(password.length<10)return toast('请先输入至少10位的新密码');
   if(!confirm('确认重置 '+name+' 的密码？对方需重新登录。'))return;
   await mojianApi('/api/account/reset-password','POST',{session:v9CloudToken(),username:name,password});toast('密码已重置');await mojianOpenAccountManager();
  }else if(act==='toggle'){
   const disabled=btn.dataset.disabled==='1';
   if(!confirm((disabled?'停用':'启用')+' '+name+'？'))return;
   await mojianApi('/api/account/toggle','POST',{session:v9CloudToken(),username:name,disabled});toast('账号状态已更新');await mojianOpenAccountManager();
  }
 }catch(err){const status=document.getElementById('mojanManageMsg');if(status)status.textContent=err.message;else toast(err.message)}
});
setTimeout(mojianAuthBoot,100);
const mojianInitReady=init();
})();
</script>

<div id="moSheetMask" class="mo-sheet-mask"></div>
<div class="mo-mobile-sheet" id="moMobileSheet" role="dialog" aria-modal="true" aria-label="快捷面板"><div class="mo-sheet-header"><strong id="moSheetTitle">章节目录</strong><button type="button" id="moCloseSheet">完成 ×</button></div><div class="mo-sheet-body" id="moSheetBody"></div></div>

<script>
/* Mobile-specific enhancements. No change to manuscript or API storage semantics. */
(()=>{
 const $=s=>document.querySelector(s);
 const mask=$('#moSheetMask'),sheet=$('#moMobileSheet'),sheetBody=$('#moSheetBody');
 let activeSheet='';
 const sheetScrollPositions={chapters:0,tools:0};
 function close(){
  if(activeSheet)sheetScrollPositions[activeSheet]=sheetBody.scrollTop;
  sheet.classList.remove('show');mask.classList.remove('show');activeSheet='';
 }
 function open(kind){
  if(!matchMedia('(max-width:660px)').matches)return;
  if(kind==='chapters'&&!document.querySelector('#editorTree,.reading-library')){document.querySelector('[data-action="editor"]')?.click();requestAnimationFrame(()=>open(kind));return}
  if(activeSheet)sheetScrollPositions[activeSheet]=sheetBody.scrollTop;
  activeSheet=kind;
  const isReading=!!$('.reading-app');
  $('#moSheetTitle').textContent=kind==='chapters'?'章节目录':'写作工具与备份';
  if(kind==='chapters'){
   const nodes=isReading?[...document.querySelectorAll('.reading-library .reading-chapter')]:[...document.querySelectorAll('#editorTree .treechapter')];
   sheetBody.innerHTML='<input type="search" id="moChapterSearch" placeholder="搜索章节…" aria-label="搜索章节">'+(nodes.length?nodes.map(n=>`<button class="mo-tool" data-mo-target="${isReading?'reader':'editor'}" data-mo-chapter="${n.dataset.readerGo||n.dataset.chapter}">${n.textContent.trim()}</button>`).join(''):'<div class="mo-help">请先打开一本作品，再进入“写作”或“阅读”查看章节。</div>');
  } else {
    const moIcon=id=>`<svg class="ico"><use href="#i-${id}"/></svg>`;
    const item=(name,label,ic)=>`<button class="mo-tool" data-mo-action="${name}">${moIcon(ic)}<span>${label}</span><svg class="ico mo-go"><use href="#i-arrow"/></svg></button>`;
    const group=(label,items)=>`<div class="mo-group"><h4>${label}</h4>${items}</div>`;
    sheetBody.innerHTML=`<div class="mo-help">每本小说的章节、人物、故事设定与 AI 对话都独立保存。手机和电脑还不会自动同步，请定期备份。</div>`+
      group('本书写作流程',item('dashboard','作品主页','home')+item('outline','世界与大纲','layers')+item('scenes','剧情卡片','list')+item('editor','正文写作','pen')+item('reading','阅读与校稿','book-open')+item('sceneStudio','章节场景工作台','layers'))+
      group('人物和故事结构',item('characters','人物档案','users')+item('relations','人物关系','network')+item('timeline','故事时间线','cal')+item('lore','世界资料库','file')+item('mindmap','故事关系网','network')+item('storyCalendar','可视化故事时间轴','cal'))+
      group('写作辅助',item('notes','灵感便笺','note')+item('tasks','写作计划','check')+item('stats','写作统计','chart')+item('toggle-assistant','右侧 AI 助手','sparkle')+item('ai','AI 交换站','download')+item('api-config','多个 API 接口管理','settings')+item('format-toolbox','小说排版工具','edit')+item('memory','全书记忆中心','note')+item('revision','AI校稿对照','sparkle')+item('advancedSearch','高级全文检索','search'))+
      group('作品管理',item('dataCenter','备份与导出中心','archive')+item('workspace-style','本书外观与便笺','settings')+item('switch-book','切换小说','switch')+item('export-project','备份当前小说','archive')+item('export-all','备份全部作品','archive')+item('import','导入备份','download')+item('settings','偏好设置','settings'));
   }
  mask.classList.add('show');sheet.classList.add('show');
  sheetBody.scrollTop=sheetScrollPositions[kind]||0;
  $('#moChapterSearch')?.addEventListener('input',e=>{const query=e.target.value.trim().toLowerCase();sheetBody.querySelectorAll('[data-mo-chapter]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(query));});
 }
 document.getElementById('moMobileDock').addEventListener('click',e=>{const btn=e.target.closest('[data-mo-open]');if(btn){e.preventDefault();open(btn.dataset.moOpen)}});
 $('#moCloseSheet').addEventListener('click',close);mask.addEventListener('click',close);
 sheetBody.addEventListener('click',ev=>{
  const choice=ev.target.closest('[data-mo-chapter]');
  if(choice){const sel=choice.dataset.moTarget==='reader'?'[data-reader-go]':'[data-chapter]';const tgt=document.querySelector(`${sel.slice(0,-1)}="${choice.dataset.moChapter}"]`);if(tgt){close();tgt.click()}return}
  const op=ev.target.closest('[data-mo-action]');if(!op)return;
  const name=op.dataset.moAction;close();
  if(name==='toggle-assistant' && !document.body.classList.contains('studio-writing')){document.querySelector('[data-action="editor"]')?.click();requestAnimationFrame(()=>document.querySelector('.editor-head [data-action="toggle-assistant"]')?.click());return}
  let action=document.querySelector(`.main [data-action="${name}"]`)||document.querySelector(`.top [data-action="${name}"]`)||document.querySelector(`.nav [data-nav="${name}"]`);
  if(action){action.click();return}
  // Route via the existing app's delegated document click handler.
  const proxy=document.createElement('button');proxy.dataset.action=name;proxy.style.display='none';document.body.append(proxy);proxy.click();proxy.remove();
 });
 function tabRefresh(){const reading=!!$('.reading-app'),writing=document.body.classList.contains('studio-writing');document.querySelectorAll('[data-mo-tab]').forEach(b=>b.classList.toggle('active',b.dataset.moTab===(writing?'editor':reading?'reading':'library')))}
 const obs=new MutationObserver(()=>tabRefresh());obs.observe($('#main'),{childList:true,subtree:false});
 document.addEventListener('click',e=>{if(e.target.closest('.mo-mobile-sheet [data-mo-chapter]'))return;setTimeout(tabRefresh,0)});
 document.addEventListener('focusin',ev=>{if(matchMedia('(max-width:660px)').matches&&ev.target.matches('textarea,input:not([type=checkbox]):not([type=radio]),[contenteditable=true]'))document.body.classList.add('mobile-typing')});
 document.addEventListener('focusout',ev=>{if(!ev.target.matches('textarea,input,[contenteditable=true]'))return;setTimeout(()=>{if(!document.activeElement?.matches('textarea,input:not([type=checkbox]):not([type=radio]),[contenteditable=true]'))document.body.classList.remove('mobile-typing')},120)});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 tabRefresh();
})();
</script>

<script>
/* V9.2.1 — navigation outside-click support; no manuscript/storage/API changes. */
(()=>{
 'use strict';
 const side=document.getElementById('sidebar');
 const overlay=document.getElementById('navDismissOverlay');
 if(!side||!overlay)return;
 const narrow=()=>window.matchMedia('(max-width:660px)').matches;
 function openState(){
   if(document.body.classList.contains('focus'))return false;
   return narrow()?side.classList.contains('mobileopen'):(document.body.classList.contains('studio-writing')&&document.body.classList.contains('nav-expanded'));
 }
 function sync(){
   const isOpen=openState();
   overlay.hidden=!isOpen;
   overlay.setAttribute('aria-hidden',String(!isOpen));
   if(document.body.classList.contains('nav-layer-open')!==isOpen)document.body.classList.toggle('nav-layer-open',isOpen);
 }
 function closeSidebar(){
   if(document.body.classList.contains('nav-expanded')){
     // Use existing action so the navigation scroll position is preserved.
     const collapse=side.querySelector('.nav-collapse[data-action="nav-toggle"]');
     if(collapse)collapse.click();
     else document.body.classList.remove('nav-expanded');
   }
   side.classList.remove('mobileopen');
   sync();
 }
 overlay.addEventListener('click',e=>{e.preventDefault();closeSidebar();});
 document.addEventListener('keydown',e=>{
   if(e.key==='Escape'&&openState())closeSidebar();
 });
 // Class observers cover menu buttons, route changes and navigation renders.
 const observer=new MutationObserver(sync);
 observer.observe(document.body,{attributes:true,attributeFilter:['class']});
 observer.observe(side,{attributes:true,attributeFilter:['class']});
 window.addEventListener('resize',sync,{passive:true});
 sync();
})();
</script>

/* V9.5.2: Suppress pointless iOS overscroll on fixed panels and at scroll boundaries.
   No interference with editable text, native select/slider, or draggable story canvas. */
(function(){
 'use strict';
 let gesture=null;
 const horizontalOnly='.novel-format-bar,.ai-quick,.v93-editor-strip';
 const verticalOnly='.nav,.mo-sheet-body,.mojan-manage-mask,.modalshade .dialog,.v95-time-card,.ed-aside,.reading-viewport,.reading-library,.read-annotation-rail';
 const freeGesture='.mind-viewport,.mindcanvas,.mind-canvas,.mindmap,.mindnode,[data-drag],[draggable="true"],.canvas-viewport,.asset-canvas';
 const nativeGesture='textarea,input,select,[contenteditable="true"],[contenteditable=""],.reading-paper';
 function isMobile(){return window.matchMedia('(max-width:870px) and (pointer:coarse)').matches;}
 function eligible(target){
  return target instanceof Element && !target.closest(freeGesture+','+nativeGesture);
 }
 function canScroll(node,axis,amount){
  if(!(node instanceof Element))return false;
  const cs=getComputedStyle(node);
  const prop=axis==='x'?'overflowX':'overflowY';
  if(!/^(auto|scroll|overlay)$/.test(cs[prop]))return false;
  const content=axis==='x'?node.scrollWidth:node.scrollHeight;
  const visible=axis==='x'?node.clientWidth:node.clientHeight;
  if(content-visible<=2)return false;
  const offset=axis==='x'?node.scrollLeft:node.scrollTop;
  // amount>0: finger slides right/down => scroll offset decreases.
  return amount>0 ? offset>1 : offset<content-visible-1;
 }
 document.addEventListener('touchstart',function(e){
  gesture=null;
  if(!isMobile()||e.touches.length!==1||!eligible(e.target))return;
  gesture={x:e.touches[0].clientX,y:e.touches[0].clientY,target:e.target};
 },{passive:true,capture:true});
 document.addEventListener('touchmove',function(e){
  if(!gesture||!isMobile()||e.touches.length!==1||!e.cancelable)return;
  const x=e.touches[0].clientX-gesture.x;
  const y=e.touches[0].clientY-gesture.y;
  if(Math.abs(x)<5&&Math.abs(y)<5)return;
  const axis=Math.abs(x)>Math.abs(y)*1.1?'x':Math.abs(y)>Math.abs(x)*1.1?'y':null;
  if(!axis)return;
  const target=gesture.target;
  if(!target.isConnected||!eligible(target)){gesture=null;return;}
  // Explicitly directional toolbars and vertical panels must not cross-scroll.
  if((axis==='y'&&target.closest(horizontalOnly))||(axis==='x'&&target.closest(verticalOnly))){e.preventDefault();return;}
  const delta=axis==='x'?x:y;
  let node=target;
  while(node instanceof Element){
   if(canScroll(node,axis,delta))return;
   node=node.parentElement;
  }
  e.preventDefault();
 },{passive:false,capture:true});
 document.addEventListener('touchend',()=>{gesture=null},{passive:true});
 document.addEventListener('touchcancel',()=>{gesture=null},{passive:true});
})();

</script>
